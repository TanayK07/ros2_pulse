## rosdoc2 configuration for ros2_pulse (docs.ros.org/en/<distro>/p/ros2_pulse).
## Generated by `rosdoc2 default_config`, then trimmed to the settings that differ.

type: 'rosdoc2 config'
version: 1

---

settings: {
    ## The headers under include/ are the probe's internal core, not an API anyone links
    ## against, so the package page leads with the user guide instead of a class list.
    never_run_doxygen: true,
    ## No Python package to document.
    never_run_sphinx_apidoc: true,
}
builders:
    - sphinx: {
        name: 'ros2_pulse',
        ## The guide in doc/ is a complete Sphinx project (its own index.md and conf.py);
        ## rosdoc2 still adds the Links, Standard Documents and dependency pages it links to.
        sphinx_sourcedir: 'doc',
      }
