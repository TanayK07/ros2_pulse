name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # BLOCKING distro matrix: every supported distro builds the package and runs the full
    # colcon test suite (unit + the LD_PRELOAD integration tests incl. the symbol-surface
    # check) inside the official ros:<distro> container. Humble = still-supported LTS with
    # LTTng-less tracetools; Jazzy = current LTS (EOL 2029); Kilted = latest release. Iron is
    # EOL (Dec 2024) and deliberately absent.
    name: build + test (${{ matrix.ROS_DISTRO }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ROS_DISTRO: [humble, jazzy, kilted]
    steps:
      - uses: actions/checkout@v4
      # industrial_ci builds the package and runs colcon test inside the container, then fails
      # the job on any test failure (AbortTestOnError). DOCKER_IMAGE pins the official ROS
      # image so the distro's own tracetools/rclcpp binaries are what we interpose, that IS
      # the compatibility claim under test.
      #
      # LTTng tooling for test_lttng_coexist.py: lttng-tools arrives through package.xml
      # (rosdep key, installed by industrial_ci's rosdep step); babeltrace2 is installed here
      # because it is deliberately NOT a declared dependency (babeltrace has no RHEL rosdep
      # mapping, which would block RPM generation on the build farm). Net effect per lane:
      # jazzy/kilted RUN the coexistence test (Iron+ tracetools links lttng-ust); humble
      # installs the tools but the test self-skips on its ldd check, which is the documented,
      # correct behaviour there.
      - uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: ${{ matrix.ROS_DISTRO }}
          ROS_REPO: main
          DOCKER_IMAGE: ros:${{ matrix.ROS_DISTRO }}
          ADDITIONAL_DEBS: build-essential babeltrace2
          AGGREGATE_TEST_RESULTS: 'true'

  # pulse-top is a pure log consumer (no ROS dep), so its suite runs on a stock python.
  pulse-top:
    name: pulse-top (pytest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install + test
        run: |
          cd tools/pulse-top
          pip install -e ".[dev]"
          python -m pytest tests/ -q

  # Standalone (no-ROS) lanes on a plain ubuntu image: the pure-C++ core + the gtest suite,
  # built via -DROS2_PULSE_STANDALONE=ON (find_package(GTest)/Threads, no ament). One plain
  # "fast" lane plus two sanitizer lanes. All three are reproducible on a stock ubuntu box
  # (no ROS container), so all three are BLOCKING, mark them required in branch protection.
  standalone:
    name: standalone core (${{ matrix.name }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fast, sanitizer: '' }
          - { name: tsan, sanitizer: 'thread' }
          - { name: asan-ubsan, sanitizer: 'address' }
    env:
      # Fail the run on the first sanitizer report rather than continuing.
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ libgtest-dev
      - name: Configure
        run: cmake -S . -B build -DROS2_PULSE_STANDALONE=ON -DROS2_PULSE_SANITIZER=${{ matrix.sanitizer }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        # setarch -R disables ASLR to dodge the TSan "unexpected memory mapping" FATAL some
        # runner kernels hit via high mmap entropy; it is harmless for the other legs.
        run: setarch "$(uname -m)" -R ctest --test-dir build --output-on-failure

  # Rolling distro lane, NON-BLOCKING (continue-on-error). Only Humble is verifiable in this
  # repo's dev environment, so rolling is observational: it watches ros2_pulse against the
  # post-#3130 built-in intra-process topic statistics (rclcpp PR #3130, merged to rolling
  # Apr 2026) to keep the intra-visibility claim honest as upstream evolves. A rolling break
  # must NOT gate merges, hence continue-on-error, do not mark this check required.
  rolling-nonblocking:
    name: ament + colcon (rolling, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: rolling
          ROS_REPO: main
          # Rolling moved past ubuntu jammy; the official ros:rolling image tracks the right
          # base OS, which is what the previous (apt-from-scratch) setup tripped over.
          DOCKER_IMAGE: ros:rolling
          ADDITIONAL_DEBS: build-essential babeltrace2
          AGGREGATE_TEST_RESULTS: 'true'
