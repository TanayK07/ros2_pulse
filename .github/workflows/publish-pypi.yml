name: publish pulse-top to PyPI

# Trusted publishing (OIDC): no token stored anywhere. PyPI must list this repository +
# workflow + environment as a trusted publisher for the project "ros2-pulse-top".
on:
  push:
    tags: ["pulse-top-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pulse-top
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: version must match the tag
        if: startsWith(github.ref, 'refs/tags/pulse-top-v')
        run: |
          tag="${GITHUB_REF#refs/tags/pulse-top-v}"
          ver="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$tag" = "$ver" || { echo "tag $tag != pyproject $ver"; exit 1; }
      - run: pip install dist/*.whl && pulse-top --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: tools/pulse-top/dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/pulse-top-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ros2-pulse-top/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
