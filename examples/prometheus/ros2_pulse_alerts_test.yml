# Unit tests for ros2_pulse_alerts.yml:  promtool test rules ros2_pulse_alerts_test.yml
#
# Synthetic series shaped like pulse-export's: one sample per 5 s scrape, and a series
# pulse-export stops exporting ends in `stale`, the marker Prometheus writes when a series
# leaves a scrape. A series that only stops getting samples would still be read for 5 minutes.

rule_files:
  - ros2_pulse_alerts.yml

evaluation_interval: 5s

tests:
  - name: probe warns fire per kind once they last 15 s
    interval: 5s
    input_series:
      # /cmd_vel out of range from 10 s to 35 s
      - series: 'ros2_pulse_warn_active{job="ros2_pulse",instance="robot:10060",pid="5151",kind="topic_rate",topic="/cmd_vel"}'
        values: '_x2 1x5 stale'
      # a gap in a single window: never fires
      - series: 'ros2_pulse_warn_active{job="ros2_pulse",instance="robot:10060",pid="4242",kind="topic_gap",topic="/scan"}'
        values: '_x2 1 stale'
      - series: 'ros2_pulse_warn_active{job="ros2_pulse",instance="robot:10060",pid="4242",kind="topic_gap",topic="/odom"}'
        values: '1x8'
      - series: 'ros2_pulse_warn_active{job="ros2_pulse",instance="robot:10060",pid="5151",kind="node_missing",node="/localization"}'
        values: '1x8'
      # pulse-export also writes recv_lag as a warn; only ROS2PulseRecvLag alerts on it
      - series: 'ros2_pulse_warn_active{job="ros2_pulse",instance="robot:10060",pid="5151",kind="recv_lag",topic="/camera/image_raw"}'
        values: '1x8'
      - series: 'ros2_pulse_topic_recv_lag_deficit_ratio{job="ros2_pulse",instance="robot:10060",pid="5151",topic="/camera/image_raw"}'
        values: '0.4x8'
    alert_rule_test:
      - eval_time: 20s
        alertname: ROS2PulseTopicRate
        exp_alerts: []
      - eval_time: 30s
        alertname: ROS2PulseTopicRate
        exp_alerts:
          - exp_labels:
              severity: warning
              job: ros2_pulse
              instance: "robot:10060"
              pid: "5151"
              kind: topic_rate
              topic: /cmd_vel
            exp_annotations:
              summary: "/cmd_vel rate is outside its expected range (pid 5151)"
              description: "The probe in pid 5151 reports a topic_rate warn for /cmd_vel: its rate in the latest window is outside the min_hz or max_hz of the expected-rate spec."
      - eval_time: 45s
        alertname: ROS2PulseTopicRate
        exp_alerts: []
      - eval_time: 30s
        alertname: ROS2PulseTopicGap
        exp_alerts:
          - exp_labels:
              severity: warning
              job: ros2_pulse
              instance: "robot:10060"
              pid: "4242"
              kind: topic_gap
              topic: /odom
            exp_annotations:
              summary: "/odom has a gap over max_gap_ms (pid 4242)"
              description: "The probe in pid 4242 reports a topic_gap warn for /odom: the largest gap between two messages is over the spec's max_gap_ms. A topic that stopped keeps this warn until it comes back."
      - eval_time: 30s
        alertname: ROS2PulseNodeMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: ros2_pulse
              instance: "robot:10060"
              pid: "5151"
              kind: node_missing
              node: /localization
            exp_annotations:
              summary: "/localization is missing (pid 5151)"
              description: "The probe in pid 5151 reports /localization as missing: the node is in the spec's nodes list and none of its endpoints carried traffic recently."
      - eval_time: 10s
        alertname: ROS2PulseRecvLag
        exp_alerts: []
      - eval_time: 30s
        alertname: ROS2PulseRecvLag
        exp_alerts:
          - exp_labels:
              severity: warning
              job: ros2_pulse
              instance: "robot:10060"
              pid: "5151"
              topic: /camera/image_raw
            exp_annotations:
              summary: "/camera/image_raw callbacks lag the publish rate (pid 5151)"
              description: "Subscription callbacks for /camera/image_raw in pid 5151 run 40% under the topic's publish rate."

  - name: a silent topic alerts while its process lives, a dead process is stale instead
    interval: 5s
    input_series:
      # pid 4242 keeps writing windows. /scan leaves them at 30 s (absent, not zero),
      # /odom reads 0 from 30 s (ROS_PULSE_EMIT_IDLE=1), /imu keeps publishing.
      - series: 'ros2_pulse_topic_publish_rate_hertz{job="ros2_pulse",instance="robot:10060",pid="4242",topic="/scan",path="inter"}'
        values: '20x5 stale'
      - series: 'ros2_pulse_topic_publish_rate_hertz{job="ros2_pulse",instance="robot:10060",pid="4242",topic="/scan",path="intra"}'
        values: '0x5 stale'
      - series: 'ros2_pulse_topic_publish_rate_hertz{job="ros2_pulse",instance="robot:10060",pid="4242",topic="/odom",path="inter"}'
        values: '50x5 0x30'
      - series: 'ros2_pulse_topic_publish_rate_hertz{job="ros2_pulse",instance="robot:10060",pid="4242",topic="/imu",path="inter"}'
        values: '200x36'
      - series: 'ros2_pulse_process_last_window_age_seconds{job="ros2_pulse",instance="robot:10060",pid="4242"}'
        values: '2x36'
      - series: 'ros2_pulse_process_window_seconds{job="ros2_pulse",instance="robot:10060",pid="4242"}'
        values: '5x36'
      # pid 7000 dies at 30 s: its topic goes and its window age grows
      - series: 'ros2_pulse_topic_publish_rate_hertz{job="ros2_pulse",instance="robot:10060",pid="7000",topic="/map",path="inter"}'
        values: '1x5 stale'
      - series: 'ros2_pulse_process_last_window_age_seconds{job="ros2_pulse",instance="robot:10060",pid="7000"}'
        values: '2x5 3+5x30'
      - series: 'ros2_pulse_process_window_seconds{job="ros2_pulse",instance="robot:10060",pid="7000"}'
        values: '5x36'
    alert_rule_test:
      - eval_time: 60s
        alertname: ROS2PulseTopicSilent
        exp_alerts: []
      - eval_time: 95s
        alertname: ROS2PulseTopicSilent
        exp_alerts:
          - exp_labels:
              severity: warning
              job: ros2_pulse
              instance: "robot:10060"
              pid: "4242"
              topic: /scan
            exp_annotations:
              summary: "/scan stopped publishing (pid 4242)"
              description: "Process 4242 published /scan at up to 20 Hz in the last 15 minutes and has published nothing for at least a minute, while it still writes windows."
          - exp_labels:
              severity: warning
              job: ros2_pulse
              instance: "robot:10060"
              pid: "4242"
              topic: /odom
            exp_annotations:
              summary: "/odom stopped publishing (pid 4242)"
              description: "Process 4242 published /odom at up to 50 Hz in the last 15 minutes and has published nothing for at least a minute, while it still writes windows."
      - eval_time: 45s
        alertname: ROS2PulseProcessStale
        exp_alerts: []
      - eval_time: 95s
        alertname: ROS2PulseProcessStale
        exp_alerts:
          - exp_labels:
              severity: critical
              job: ros2_pulse
              instance: "robot:10060"
              pid: "7000"
            exp_annotations:
              summary: "pid 7000 stopped writing probe windows"
              description: "pulse-export has read no window from pid 7000 for 68 s, more than three of its window periods. The process crashed, hung or exited."

  - name: exporter down after a minute, other jobs ignored
    interval: 5s
    input_series:
      - series: 'up{job="ros2_pulse",instance="robot:10060"}'
        values: '1x5 0x20'
      - series: 'up{job="node",instance="robot:9100"}'
        values: '0x25'
    alert_rule_test:
      - eval_time: 60s
        alertname: ROS2PulseExporterDown
        exp_alerts: []
      - eval_time: 95s
        alertname: ROS2PulseExporterDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: ros2_pulse
              instance: "robot:10060"
            exp_annotations:
              summary: "pulse-export at robot:10060 is down"
              description: "Prometheus has not scraped pulse-export at robot:10060 for a minute, so none of the ros2_pulse alerts for it can fire."
